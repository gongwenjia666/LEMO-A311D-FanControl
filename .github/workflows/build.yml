name: Build FanCtl APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 与上传 APK 需要写权限

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史与 tag：数当日 tag 定序号

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "未配置 RELEASE_KEYSTORE_BASE64，本次回退 debug 证书签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "已载入正式签名证书"

      - name: Resolve version
        run: |
          set -euo pipefail
          # 统一按北京时间取日期，避免 CI 的 UTC 错位
          DATE=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          # 当日第几次发布：已有 tag 数 + 1（新格式与历史格式一并统计，避免序号回退）
          OLD_SEQ=$(git tag -l "v${DATE}.*" | wc -l)
          NEW_SEQ=$(git tag -l "v${DATE}_*" | wc -l)
          SEQ=$(( OLD_SEQ + NEW_SEQ + 1 ))
          VERSION_NAME="v${DATE}_${SEQ}"
          YMD=$(TZ=Asia/Shanghai date +%Y%m%d)
          # versionCode = yyyymmdd + 两位当日序号，10 位整数，单调递增
          VERSION_CODE="${YMD}$(printf '%02d' "$SEQ")"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "版本：${VERSION_NAME}（versionCode=${VERSION_CODE}）"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Package APK
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/FanCtl-${VERSION_NAME}.apk"
          done
          ls -lh dist

      - name: Verify signature
        run: |
          APK=$(ls dist/*.apk | head -1)
          echo "产物：$APK"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$SIGNER" verify --print-certs "$APK" | head -6

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FanCtl-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: FanCtl ${{ env.VERSION_NAME }}
          body: |
            ### 本次更新

            ${{ github.event.head_commit.message }}

            ### 安装包

            - 版本：${{ env.VERSION_NAME }}（versionCode ${{ env.VERSION_CODE }}）
            - 构建：release 变体，正式证书签名
            - 提交：${{ github.sha }}
          make_latest: true
          files: dist/*.apk
